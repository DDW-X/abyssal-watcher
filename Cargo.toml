
[package]
name = "abyssal_watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
anyhow = "1.0"
syslog = "5"
aya = "0.14.0"
aya-log = "0.3.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# Dependencies for enhanced logging or crypto can be added here as needed
